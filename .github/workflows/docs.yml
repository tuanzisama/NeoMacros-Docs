name: docs

# Regenerates the API documentation from the NeoMacros mod sources
# (builder/), builds the static site, and deploys the prebuilt output to
# Vercel. The generated content trees are never committed: .gitignore
# excludes them, so local clones stay clean and the Vercel Git
# integration is disconnected — this workflow is the only deploy path.
#
# Triggers: pushes touching the pipeline or site, manual dispatch, and
# the `api-docs` repository_dispatch event sent by the mod repository's
# docs-dispatch workflow when its API sources change.
on:
  push:
    branches: [master]
    paths:
      - "builder/**"
      - "scripts/**"
      - "content/**"
      - "api-examples/**"
      - "server/**"
      - "app/**"
      - "public/**"
      - "nuxt.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  repository_dispatch:
    types: [api-docs]
  workflow_dispatch:

# Deploys, but no longer writes to the repository.
permissions:
  contents: read

concurrency:
  group: docs-regen
  cancel-in-progress: false

jobs:
  build:
    name: regenerate, build and deploy site
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # The mod repository holds the facade sources (core + ports) the
      # generator scans and the doc-api annotations it resolves by
      # coordinates from the local repository.
      - uses: actions/checkout@v5
        with:
          repository: tuanzisama/NeoMacros
          path: mod

      # The builder's Gradle build runs its toolchain on JVM 25 (the same
      # JDK the mod build's daemon needs for fabric-loom).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish doc-api annotations to the local repository
        working-directory: mod
        run: ./gradlew :doc-api:publishToMavenLocal --console=plain

      - name: Generate API docs from the current sources
        run: ./gradlew -p builder generateApiDocs -PneomacrosRoot="${{ github.workspace }}/mod" --console=plain

      - name: Sync generated docs into the site
        run: bash scripts/sync-generated-docs.sh

      # Generation warnings (missing translations, missing @ApiSince) stay
      # inspectable without failing the build.
      - name: Upload generation warnings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-warnings
          path: builder/build/gen/md/api/warnings.txt
          if-no-files-found: ignore

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site build doubles as validation: it fails when the synced
      # trees cannot produce a working site.
      - name: Build site
        run: npm run generate

      # Associate the deployment with the existing Vercel project via the
      # ID pair (dashboard: Project Settings → General), then upload the
      # fully prerendered static output as a production deployment. The
      # output directory is self-contained: Nitro prerenders the section
      # redirects as real pages, so serving it statically matches the
      # previous Git-integration builds.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          { "orgId": "$VERCEL_ORG_ID", "projectId": "$VERCEL_PROJECT_ID" }
          JSON

      - name: Deploy to Vercel
        run: npx --yes vercel@latest deploy .output/public --prod --yes --token="$VERCEL_TOKEN"
